<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#9f1239" />
        <title>Pas de réseau · Vinora</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root {
                color-scheme: light dark;
                --bg: #faf7f1;
                --fg: #3a1d22;
                --muted: #8a6f6a;
                --primary: #9f1239;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1c1012;
                    --fg: #f5ede6;
                    --muted: #b9a49d;
                    --primary: #fb7185;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background:
                    radial-gradient(
                        circle at 15% 10%,
                        rgb(225 29 72 / 0.18),
                        transparent 50%
                    ),
                    radial-gradient(
                        circle at 90% 30%,
                        rgb(234 179 8 / 0.18),
                        transparent 50%
                    ),
                    var(--bg);
                color: var(--fg);
                font-family:
                    'Plus Jakarta Sans',
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                text-align: center;
            }

            .glass {
                font-size: 72px;
                animation: float 4s ease-in-out infinite;
            }

            h1 {
                margin: 16px 0 8px;
                font-size: 28px;
                letter-spacing: -0.02em;
            }

            p {
                margin: 0 auto;
                max-width: 320px;
                color: var(--muted);
                line-height: 1.5;
            }

            button {
                margin-top: 28px;
                height: 48px;
                padding: 0 24px;
                border: 0;
                border-radius: 16px;
                background: linear-gradient(135deg, #e11d48, var(--primary));
                color: white;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0) rotate(0deg);
                }
                50% {
                    transform: translateY(-10px) rotate(-6deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .glass {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="glass" aria-hidden="true">🍷</div>
            <h1>Pas de réseau</h1>
            <p>
                Ta cave est toujours là, promis. Les bouteilles n’ont pas bougé
                : on se reconnecte dès que le réseau revient.
            </p>
            <button type="button" onclick="location.reload()">Réessayer</button>
        </main>
        <script>
            window.addEventListener('online', () => location.reload());
        </script>
    </body>
</html>
